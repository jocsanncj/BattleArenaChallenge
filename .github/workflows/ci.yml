name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: python -m unittest discover -s tests -v
      - name: Build server image
        run: docker build --tag battle-arena-server:test .
      - name: Smoke test server container
        run: |
          docker run --detach \
            --name battle-arena-server \
            --publish 127.0.0.1:8000:8000 \
            --env DATA_DIR=/tmp/battle-arena-ci \
            battle-arena-server:test
          cleanup() {
            docker rm --force battle-arena-server >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs battle-arena-server
          exit 1
