services:
  servidor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATA_DIR: /data
      FIREBASE_ADMIN_CREDENTIALS: /run/secrets/firebase-admin.json
    volumes:
      - battle-arena-data:/data
      - ./proyecto-modelado-dee24-firebase-adminsdk-fbsvc-1806a6701a.json:/run/secrets/firebase-admin.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  battle-arena-data:
